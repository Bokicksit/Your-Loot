# The stack the tests are allowed to destroy.
#
#   docker compose -f compose.test.yaml run --rm tests
#
# Separate from compose.dev.yaml on purpose, and not sharing a thing with it:
# its own project name, its own database, and storage that lives and dies with
# the container rather than in ./data. Restoring a backup replaces the entire
# database, so a test suite that can do it must not be one flag away from
# doing it to the install holding somebody's actual collection.

name: yourloot-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getloot
      POSTGRES_PASSWORD: test
      POSTGRES_DB: getloot
    # tmpfs, not a volume: nothing here should outlive the run
    tmpfs:
      - /var/lib/postgresql/data
    # a second database for the single-user API, created on first start
    volumes:
      - ./deploy/test-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getloot"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://getloot:test@postgres:5432/getloot
      IMAGE_DIR: /data/images
      # accounts on, because the tenancy suite has nothing to say otherwise
      AUTH_MODE: multi
      SECRET_KEY: test-only-not-a-secret
      # 20,000 cards is a slow start and no test needs the catalogue
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # The default mode gets its own API, because the single-user lock only
  # exists there and it is what most installs will actually run.
  api-single:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://getloot:test@postgres:5432/solo
      IMAGE_DIR: /data/images
      AUTH_MODE: single
      SECRET_KEY: test-only-not-a-secret
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # The hosted service: accounts on and anybody may make one. Its own database
  # because the invite-only API next door must keep behaving as though this
  # setting does not exist.
  api-open:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://getloot:test@postgres:5432/opensignup
      IMAGE_DIR: /data/images
      AUTH_MODE: multi
      OPEN_SIGNUP: "true"
      # the whole suite signs up from one container, so it looks like one very
      # busy household. Raised here rather than lowering the real default.
      SIGNUP_LIMIT: "500"
      SECRET_KEY: test-only-not-a-secret
      # Configured, but pointed at a dead port. "This server can send mail"
      # is a thing the routes branch on and therefore has to be exercised;
      # actually reaching Resend from a test suite is not. Connection refused
      # comes back instantly and the mailer swallows it, which is the same
      # path a provider having a bad afternoon takes.
      #
      # The api container next door has none of this on purpose — that is the
      # self-hosted install, and it must keep offering no reset at all.
      RESEND_API_KEY: test-only-not-a-real-key
      MAIL_FROM: noreply@example.com
      MAIL_API_URL: http://127.0.0.1:9/mail-goes-nowhere
      PUBLIC_URL: http://api-open:8000
      SEED_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://getloot:test@postgres:5432/getloot
      OPEN_DATABASE_URL: postgresql+psycopg2://getloot:test@postgres:5432/opensignup
      # The same key the API signs with, so a test can mint an image link and
      # have the API accept it. They are separate processes, and without a
      # shared SECRET_KEY each derives its own — which is exactly what would
      # happen between two API replicas, and would break image links between
      # them the same way.
      SECRET_KEY: test-only-not-a-secret
      LOOT_URL: http://api:8000
      LOOT_SOLO_URL: http://api-single:8000
      LOOT_OPEN_URL: http://api-open:8000
      # the opt-in from conftest.py. Set here and nowhere else.
      LOOT_DESTRUCTIVE_OK: "1"
    depends_on:
      api:
        condition: service_started
      api-single:
        condition: service_started
      api-open:
        condition: service_started
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet --disable-pip-version-check -r requirements-dev.txt &&
             for u in http://api:8000 http://api-single:8000 http://api-open:8000; do
               until python -c \"import httpx,sys; sys.exit(0 if httpx.get('$$u/api/health', timeout=2).status_code==200 else 1)\" 2>/dev/null; do sleep 1; done;
             done &&
             python -m pytest tests -q"
