# Your Loot — self-hosted. Pulls prebuilt images; nothing to compile.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD at minimum
#   docker compose up -d
#
# Then open http://localhost:8080. The card database seeds itself on first
# start (~20k cards, a couple of minutes) — watch it with:
#   docker compose logs -f api
#
# Developing on the code instead? Use compose.dev.yaml, which builds locally:
#   docker compose -f compose.dev.yaml up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-getloot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-getloot}
    volumes:
      # bind mounts, not named volumes: easy to snapshot/back up
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-getloot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/bokicksit/yourloot-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-getloot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-getloot}
      IMAGE_DIR: /data/images
      AUTH_MODE: ${AUTH_MODE:-single}
      AVAILABLE_MODULES: ${AVAILABLE_MODULES:-}
      PAID_MODULES: ${PAID_MODULES:-}
      FREE_CARD_LIMIT: ${FREE_CARD_LIMIT:-0}
      FREE_DEX_LIMIT: ${FREE_DEX_LIMIT:-0}
      FREE_BINDER_LIMIT: ${FREE_BINDER_LIMIT:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      PUBLIC_PROFILES: ${PUBLIC_PROFILES:-false}
      SIGNUP_LIMIT: ${SIGNUP_LIMIT:-20}
      PUBLIC_URL: ${PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      # optional: without these, game/movie lookup returns a clear "not
      # configured" message and manual entry still works
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      REBRICKABLE_API_KEY: ${REBRICKABLE_API_KEY:-}
      COMICVINE_API_KEY: ${COMICVINE_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      # seed the full card database on first start (set false to skip)
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_JAPANESE: ${SEED_JAPANESE:-false}
    volumes:
      - ./data/images:/data/images
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/bokicksit/yourloot-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
