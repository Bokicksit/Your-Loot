# TrueNAS SCALE deployment — paste into Apps -> Discover Apps -> Custom App
# -> "Install via YAML". Pulls prebuilt images from GHCR (no build on the NAS).
#
# BEFORE PASTING, edit:
#   1. CHANGE_ME         -> a real Postgres password (both places)
#   2. /mnt/tank/apps/…  -> your actual dataset paths (create them first:
#                           one dataset for postgres, one for images)
#   3. IGDB/TMDB keys    -> optional; without them those searches report
#                           "not configured" and manual entry still works
#
# Update flow: push to main -> Actions builds :latest -> update the app
# (re-deploy) on TrueNAS to pull the new images. Pin a sha tag instead of
# :latest if you want explicit upgrades. To force it now:
#   sudo midclt call -job app.pull_images yourloot '{"redeploy": true}'
#
# Card database refresh (weekly cron, System Settings -> Advanced -> Cron
# Jobs, run as root):
#   0 4 * * 0  docker exec getloot-api python /seed/seed_cards.py --download

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: getloot
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: getloot
    volumes:
      - /mnt/tank/apps/getloot/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getloot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/bokicksit/getloot-api:latest
    container_name: getloot-api # stable name for the refresh cron job
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://getloot:CHANGE_ME@postgres:5432/getloot
      IMAGE_DIR: /data/images
      # Optional, all free. Fill one in to enable that collection's online
      # search; leave it blank and manual entry still works.
      # IGDB (Twitch dev app) — game search
      IGDB_CLIENT_ID: ""
      IGDB_CLIENT_SECRET: ""
      TMDB_API_KEY: ""       # movies
      REBRICKABLE_API_KEY: "" # LEGO
      COMICVINE_API_KEY: ""   # comics
      # downloads the full card database on first start (safe to leave on;
      # it only runs when the catalog is empty)
      SEED_ON_START: "true"
    volumes:
      - /mnt/tank/apps/getloot/images:/data/images
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ghcr.io/bokicksit/getloot-web:latest
    restart: unless-stopped
    ports:
      # 30080, not 8080: TrueNAS apps commonly take 8080 already. This is the
      # only published port; nginx proxies /api to the api container.
      - "30080:80"
    depends_on:
      - api
