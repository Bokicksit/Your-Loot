name: Bug report
description: Something behaves wrong, looks wrong, or falls over
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Half the bugs in this app come down to one odd record in somebody
        else's collection, so **if a specific item is involved, include its
        barcode or catalogue number.** It's usually the whole answer.

  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom of the Settings page, or `docker image ls | grep getloot`
      placeholder: "2.01"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Cards / Pokédex
        - Games
        - Hardware
        - Movies
        - Books
        - Records
        - LEGO
        - Comics
        - Barcode scanning
        - Backup / restore
        - Setup, deployment or upgrade
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: input
    id: item
    attributes:
      label: The item involved, if there is one
      description: Barcode, set + card number, IGDB/TMDB title — whatever identifies it.
      placeholder: "e.g. 0045496590420, or Charizard ex 006/165 (MEW)"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        `docker compose logs --tail=50 api` — and for anything that happens in
        the browser (scanning, images, a blank screen), the browser console too.
      render: shell

  - type: dropdown
    id: platform
    attributes:
      label: Running on
      options:
        - Docker Compose on Linux
        - TrueNAS SCALE
        - Unraid
        - Synology / QNAP
        - Raspberry Pi or other ARM
        - Docker Desktop (Windows/macOS)
        - Something else
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Matters for anything involving the camera or the layout.
      placeholder: "Chrome on Android 14 / Safari on iPhone 15"
