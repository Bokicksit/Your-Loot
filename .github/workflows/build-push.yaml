name: build-and-push

on:
  push:
    branches: [main]
  # Startable by hand from the Actions tab. Push events go through webhooks,
  # which GitHub throttles during an Actions incident — a push then triggers
  # nothing at all, silently, and without this there is no run to re-run and
  # no way to ask for one short of another commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - image: getloot-api
            context: . # repo root — api/Dockerfile copies /seed too
            dockerfile: api/Dockerfile
          - image: getloot-web
            context: ./web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: a large share of self-hosters are on a Pi, an
      # ARM NAS or Apple Silicon, and an amd64-only image simply won't start
      # for them. QEMU emulates the foreign architecture; buildx drives both
      # builds and publishes them under one manifest, so `docker pull` picks
      # the right one with no tag suffix to remember.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: appver
        # strip a byte-order mark and stray whitespace: either would land in the
        # image tag, and a tag has to start with an alphanumeric
        run: |
          version=$(sed -e '1s/^\xEF\xBB\xBF//' VERSION | tr -d '[:space:]')
          case "$version" in
            [0-9]*) ;;
            *) echo "VERSION is not a version number: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repo owner for valid image names
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # sha for traceability, latest for the NAS update flow, and the
          # VERSION number for pinning/rollback (visible in TrueNAS workloads)
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.appver.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # without a cache the emulated arm64 leg reinstalls every dependency
          # from scratch on every push; scope keeps api and web from evicting
          # each other's layers out of the shared 10GB
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
