name: build-and-push

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - image: getloot-api
            context: . # repo root — api/Dockerfile copies /seed too
            dockerfile: api/Dockerfile
          - image: getloot-web
            context: ./web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: appver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repo owner for valid image names
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # sha for traceability, latest for the NAS update flow, and the
          # VERSION number for pinning/rollback (visible in TrueNAS workloads)
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.appver.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
