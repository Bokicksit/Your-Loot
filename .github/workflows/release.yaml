name: release

# A tag is the only thing anyone should pin to. Pushing one publishes the
# GitHub Release automatically so that the notes, the tag and the image tag
# can't drift apart — which is what happens when releases are written by hand
# and one of the three gets forgotten.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # --generate-notes needs the history to diff against

      - id: v
        # the tag is authoritative for the release; VERSION has to agree with
        # it or the release would point at image tags that don't exist
        run: |
          tag="${GITHUB_REF_NAME}"
          file=$(sed -e '1s/^\xEF\xBB\xBF//' VERSION | tr -d '[:space:]')
          if [ "$tag" != "v$file" ]; then
            echo "tag $tag does not match VERSION ($file) — expected v$file" >&2
            exit 1
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Images

          Multi-arch (\`linux/amd64\`, \`linux/arm64\`):

          \`\`\`
          ghcr.io/bokicksit/yourloot-api:${VERSION}
          ghcr.io/bokicksit/yourloot-web:${VERSION}
          \`\`\`

          Pin this release by setting \`TAG=${VERSION}\` in your \`.env\`, then
          \`docker compose pull && docker compose up -d\`. Migrations run on
          start. **Take a backup from the Settings page first** — downgrading
          across a schema change is not supported.
          EOF
          # Making the release by hand in the web UI publishes the tag, which
          # runs this — so by the time it gets here the release it means to
          # create already exists and `gh release create` exits 1. That is a
          # red cross against a job that did nothing wrong, and a workflow
          # that cries wolf is one nobody reads.
          #
          # So if it is already there, leave it alone: somebody wrote those
          # notes on purpose and they beat anything generated here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME was released by hand — leaving it as it is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
